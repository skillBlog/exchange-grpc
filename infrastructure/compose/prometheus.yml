global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: userservice
    metrics_path: /metrics
    static_configs:
      - targets: ["userservice:2112"]

  - job_name: spotservice
    metrics_path: /metrics
    static_configs:
      - targets: ["spotservice:2112"]

  - job_name: orderservice
    metrics_path: /metrics
    static_configs:
      - targets: ["orderservice:2112"]
