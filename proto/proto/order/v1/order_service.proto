syntax = "proto3";

package order.v1;

option go_package = "github.com/exchange-grpc/proto/pb/order/v1;orderv1";

import "buf/validate/validate.proto";
import "common/v1/decimal.proto";
import "common/v1/money.proto";
import "common/v1/order_side.proto";
import "common/v1/order_status.proto";
import "common/v1/pagination.proto";
import "google/protobuf/timestamp.proto";

// OrderService — сервис управления ордерами.
service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrderStatus(GetOrderStatusRequest) returns (GetOrderStatusResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc StreamOrderUpdates(StreamOrderUpdatesRequest) returns (stream OrderUpdate);
  rpc StreamUserOrderUpdates(StreamUserOrderUpdatesRequest) returns (stream OrderUpdate);
}

// CreateOrderRequest — параметры создания market-ордера.
// user_id и роли извлекаются на сервере из JWT/metadata.
message CreateOrderRequest {
  string market_id = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 64,
    pattern: "^[A-Z0-9]+-[A-Z0-9]+$"
  }];
  common.v1.OrderSide side = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  // Опционально для market-ордера. Если передано — вложенный Money проверяется (amount > 0).
  common.v1.Money price = 3;
  common.v1.Decimal quantity = 4 [(buf.validate.field).required = true];
  // Опционально: пустое значение пропускает правила (IGNORE_IF_ZERO_VALUE).
  string idempotency_key = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {min_len: 1, max_len: 128}
  ];
}

message CreateOrderResponse {
  string order_id = 1 [(buf.validate.field).string.uuid = true];
  common.v1.OrderStatus status = 2;
}

message GetOrderStatusRequest {
  string order_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetOrderStatusResponse {
  string order_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  string market_id = 3;
  common.v1.OrderSide side = 4;
  common.v1.Money price = 5;
  common.v1.Decimal quantity = 6;
  common.v1.OrderStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// ListOrdersRequest — список ордеров текущего пользователя (user_id из JWT).
// market_id и status опциональны: пустое значение не фильтрует.
message ListOrdersRequest {
  common.v1.CursorPagination pagination = 1;
  optional string market_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      min_len: 1,
      max_len: 64,
      pattern: "^[A-Z0-9]+-[A-Z0-9]+$"
    }
  ];
  optional common.v1.OrderStatus status = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];
}

message ListOrdersResponse {
  repeated OrderSummary orders = 1;
  common.v1.CursorPageInfo page_info = 2;
}

message OrderSummary {
  string order_id = 1 [(buf.validate.field).string.uuid = true];
  string market_id = 2;
  common.v1.OrderSide side = 3;
  common.v1.Money price = 4;
  common.v1.Decimal quantity = 5;
  common.v1.OrderStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message StreamOrderUpdatesRequest {
  string order_id = 1 [(buf.validate.field).string.uuid = true];
}

// StreamUserOrderUpdatesRequest — поток обновлений всех ордеров текущего пользователя (user_id из JWT).
// Фильтры опциональны: пустое значение не сужает поток.
message StreamUserOrderUpdatesRequest {
  optional string market_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      min_len: 1,
      max_len: 64,
      pattern: "^[A-Z0-9]+-[A-Z0-9]+$"
    }
  ];
  optional common.v1.OrderStatus status = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];
}

message OrderUpdate {
  string order_id = 1 [(buf.validate.field).string.uuid = true];
  common.v1.OrderStatus status = 2;
  google.protobuf.Timestamp updated_at = 3;
}
